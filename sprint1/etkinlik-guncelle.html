<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
    </header>
    
    <nav>
        <a href="index.html">Ana Sayfa</a> |
        <a href="etkinlikler.html">Etkinlikler</a> |

    <main>
<h2>Etkinlik Güncelle</h2>
        <form action="#" method="POST">
            <label for="ad">Etkinlik Adı:</label><br>
            <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required><br><br>

            <label for="kategori">Kategori:</label><br>
            <select id="kategori" name="kategori" required>
                <option value="Seminer" selected>Seminer</option>
                <option value="Atölye">Atölye</option>
            </select><br><br>

            <label for="tarih">Tarih:</label><br>
            <input type="date" id="tarih" name="tarih" value="2026-10-12" required><br><br>

            <label for="saat">Saat:</label><br>
            <input type="time" id="saat" name="saat" value="14:00" required><br><br>

            <label for="yer">Yer:</label><br>
            <input type="text" id="yer" name="yer" value="A Blok Konferans Salonu" required><br><br>

            <label for="aciklama">Açıklama:</label><br>
            <textarea id="aciklama" name="aciklama" required>Sektörün önde gelen isimleriyle tanışma fırsatı yakalayacağınız kariyer günlerine tüm öğrencilerimiz davetlidir.</textarea><br><br>

            <button type="submit">Güncelle</button>
        </form>    </main>

    <footer>
        <p>Teoman Bayındır · 2311012047 · 2026</p>
    </footer>
</body>
</html>

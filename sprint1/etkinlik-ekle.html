<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri</title>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
    </header>
    
    <nav>
        <a href="index.html">Ana Sayfa</a> |
        <a href="etkinlikler.html">Etkinlikler</a> |

        <a href="etkinlik-ekle.html">Ekle</a>
    </nav>

    <main>
<h2>Etkinlik Ekle</h2>
        <form action="#" method="POST">
            <label for="ad">Etkinlik Adı:</label><br>
            <input type="text" id="ad" name="ad" required><br><br>

            <label for="kategori">Kategori:</label><br>
            <select id="kategori" name="kategori" required>
                <option value="">Seçiniz...</option>
                <option value="Seminer">Seminer</option>
                <option value="Atölye">Atölye</option>
            </select><br><br>

            <label for="tarih">Tarih:</label><br>
            <input type="date" id="tarih" name="tarih" required><br><br>

            <label for="saat">Saat:</label><br>
            <input type="time" id="saat" name="saat" required><br><br>

            <label for="yer">Yer:</label><br>
            <input type="text" id="yer" name="yer" required><br><br>

            <label for="aciklama">Açıklama:</label><br>
            <textarea id="aciklama" name="aciklama" required></textarea><br><br>

            <button type="submit">Gönder</button>
        </form>    </main>

    <footer>
        <p>Teoman Bayındır · 2311012047 · 2026</p>
    </footer>
</body>
</html>
